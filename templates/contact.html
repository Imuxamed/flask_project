{% extends "base.html" %}

{% block title %}Оставить сообщение{% endblock %}

{% block content %}
    <h1>Оставить сообщение</h1>
    <p>Вы вошли как <strong>{{ session.username }}</strong>. Ваше имя подпишется автоматически.</p>

    <form method="POST">
        <p>
            <label>Сообщение:</label><br>
            <textarea name="message" rows="5" cols="40" required></textarea>
        </p>
        <p>
            <button type="submit">Отправить</button>
        </p>
    </form>
{% endblock %}
