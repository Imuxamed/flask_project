{% extends "base.html" %}

{% block title %}Забыли пароль?{% endblock %}

{% block content %}
    <h1>Забыли пароль?</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p style="color: {% if category == 'error' %}red{% else %}green{% endif %};">
                {{ message }}
            </p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <p>
            <label>Введите ваш email:</label><br>
            <input type="email" name="email" required>
        </p>
        <p>
            <button type="submit">Получить токен</button>
        </p>
    </form>

    <p><a href="/login">← Назад ко входу</a></p>
{% endblock %}
