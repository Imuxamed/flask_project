<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
	<title>{% block title %}Мой сайт{% endblock %}</title>                                                      	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
    <a href="/">Главная</a> |
    <a href="/about">Обо мне</a> |
    <a href="/contact">Связаться</a> |
    <a href="/messages">Гостевая</a> |
    {% if session.user_id %}
        | <a href="/profile">Привет, {{ session.username }}!</a> |
        <a href="/logout">Выйти</a>
    {% else %}
        | <a href="/register">Регистрация</a> |
        <a href="/login">Вход</a>
    {% endif %} 
    
 </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
